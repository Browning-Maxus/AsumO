name: asumo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_svg: ^2.1.0
  flutter_riverpod: ^2.4.0
  http: ^1.1.0
  flutter_blue_plus: ^2.3.9
  permission_handler: ^11.0.0
  flutter_dotenv: ^6.0.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.2.26
flutter_icons:
  android: true
  ios: true
  image_path: images/AsumoLogoMark.png
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: images/AsumoLogoMark.png
flutter_native_splash:
  color: "#FFFFFF"
  image: images/AsumoLogoMark.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  web: false
flutter:
  uses-material-design: true
  assets:
    - images/
    - .env